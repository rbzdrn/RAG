# Obsidian 个人知识库 RAG 配置
# 所有路径均可用环境变量覆盖：OBSIDIAN_VAULT / RAG_INDEX_DIR

# Obsidian 仓库根目录（改成你自己的）
vault_path: "C:/Users/admin/Documents/Obsidian Vault/hx"

# 索引存放目录（相对本配置文件所在目录）
index_dir: "./.lancedb"

# 扫描时跳过的文件/目录（相对 vault 的 glob）
exclude_globs:
  - ".obsidian/**"
  - ".trash/**"
  - ".git/**"
  - "**/*.excalidraw.md"
  - "**/模板/**"
  - "**/Templates/**"

# ---------- 切块 ----------
chunk:
  # 子块目标长度（字符）。中文一个字约等于一个 token 量级
  target_chars: 420
  # 子块最大长度，超过则按句子再拆
  max_chars: 900
  # 子块最小长度，过短的块会与相邻块合并
  min_chars: 120
  # 拆分超长段落时的重叠字符数
  overlap_chars: 80
  # 父块（所属章节全文）上限，用于回填给大模型
  parent_max_chars: 2000
  # 是否在子块正文前拼接「笔记标题 > 章节 > 小节」的面包屑
  breadcrumb_prefix: true

# ---------- 向量化（本地） ----------
embed:
  # sentence-transformers / ollama；ollama 走本机 /api/embed，无需 torch
  backend: "ollama"
  # Ollama 中已拉取的 bge-m3
  model: "bge-m3"
  base_url: "http://127.0.0.1:11434"
  # ollama 后端需要显式声明维度（bge-m3 = 1024）
  dim: 1024
  # auto / cpu / cuda
  device: "auto"
  batch_size: 16
  max_seq_length: 512
  # bge-m3 不需要指令前缀；换回 bge-zh-v1.5 时填「为这个句子生成表示以用于检索相关文章：」
  query_prefix: ""

# ---------- 重排 ----------
rerank:
  # 本机没有 CrossEncoder 模型，先关闭；装了 bge-reranker-base 后可改回 true
  enabled: false
  model: "BAAI/bge-reranker-base"
  # 进入重排的候选数量（重排关闭时，这里也是融合后的候选池上限）
  top_n: 30

# ---------- 检索 ----------
retrieval:
  # 召回窗口别太小：实测「都有那些数据类型」的正确块（1-04 类型转换）向量排名第 38，
  # dense_k=20 会被直接截断，导致答非所问。50 能把它捞回来
  dense_k: 50
  bm25_k: 50
  # RRF 融合常数
  rrf_k: 60
  # 最终送给大模型的片段数
  final_k: 5
  # 上下文总长度上限
  context_max_chars: 7000
  # 【第一道闸】绝对阈值靠不住（实测：库里完全没写的问题，bge-m3 也能给到 0.55），
  # 所以只做相对过滤：留下与最高分差距在 dense_margin 以内的块
  min_dense_score: 0.30
  dense_margin: 0.10
  # 【第二道闸的前置检查】生成前先用一次极短调用判断「这段片段能否回答问题」，
  # 判定不能就直接拒答，不再生成。关掉它就会退回到“只靠 system prompt 约束”
  verify_with_llm: true
  # 最高向量分已经很高时，说明十有八九能答，跳过预检省一次往返
  skip_verify_score: 0.65

# ---------- 生成 ----------
llm:
  # 本机 Ollama 的 OpenAI 兼容接口；换回 DeepSeek 时改回 https://api.deepseek.com + deepseek-chat
  base_url: "http://127.0.0.1:11434/v1"
  model: "qwen2.5:7b"
  # 留空则读环境变量 api_key_env（本机用 OLLAMA_API_KEY=ollama 占位）
  api_key: ""
  api_key_env: "OLLAMA_API_KEY"
  temperature: 0.2
